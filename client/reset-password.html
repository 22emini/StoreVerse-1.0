<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your StoreVerse account.">
  <title>Reset Password — StoreVerse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <div class="brand-mark">S</div>
        <h1>StoreVerse</h1>
      </div>

      <div class="auth-card">
        <h2>Reset password</h2>
        <p class="auth-subtitle">Enter the token from your email and choose a new password.</p>

        <div id="auth-msg" class="auth-message hidden"></div>

        <form id="reset-form">
          <div class="form-group">
            <label class="form-label" for="token">Reset token</label>
            <input class="input" type="text" id="token" name="token" placeholder="Paste your reset token" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">New password</label>
            <div class="password-wrapper">
              <input class="input" type="password" id="password" name="password" placeholder="Choose a strong password" required>
              <button type="button" class="password-toggle">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Reset password</button>
        </form>
      </div>

      <div class="auth-footer">
        <a href="index.html">Back to sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.initResetPassword();
    Auth.initPasswordToggles();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Complete your StoreVerse account setup.">
  <title>Complete Registration — StoreVerse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <div class="brand-mark">S</div>
        <h1>StoreVerse</h1>
      </div>

      <div class="auth-card">
        <h2>Complete your profile</h2>
        <p class="auth-subtitle">Your email is verified! Set up your name, password, and phone number.</p>

        <div id="auth-msg" class="auth-message hidden"></div>

        <form id="complete-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="name">Full name</label>
            <input class="input" type="text" id="name" name="name" placeholder="John Doe" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-wrapper">
              <input class="input" type="password" id="password" name="password" placeholder="Create a strong password" required>
              <button type="button" class="password-toggle">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone number <span class="text-secondary text-sm">(optional)</span></label>
            <input class="input" type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000">
          </div>
          <button type="submit" class="btn btn-primary">Complete registration</button>
        </form>
      </div>

      <div class="auth-footer">
        Already completed? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.initCompleteRegistration();
    Auth.initPasswordToggles();
  </script>
</body>
</html>

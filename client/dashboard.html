<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="StoreVerse Dashboard — manage your stores, products, orders, and more.">
  <title>Dashboard — StoreVerse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="Sidebar.toggle()"></div>

    <!-- Main Content -->
    <div class="main-wrapper">
      <header class="topbar" id="topbar"></header>
      <main class="page-content" id="page-content">
        <div class="loading-spinner"></div>
      </main>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>

  <!-- Components -->
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/table.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/components/charts.js"></script>

  <!-- Pages -->
  <script src="js/pages/overview.js"></script>
  <script src="js/pages/stores.js"></script>
  <script src="js/pages/products.js"></script>
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/customers.js"></script>
  <script src="js/pages/orders.js"></script>
  <script src="js/pages/shipments.js"></script>
  <script src="js/pages/marketing.js"></script>
  <script src="js/pages/team.js"></script>
  <script src="js/pages/settings.js"></script>

  <script>
    (async function boot() {
      // Auth guard
      if (!AppStore.requireAuth()) return;

      // Render layout
      Sidebar.render();
      await AppStore.loadStores();
      Topbar.render();

      // Register routes
      Router.on('overview',  OverviewPage.render);
      Router.on('stores',    StoresPage.render);
      Router.on('products',  ProductsPage.render);
      Router.on('inventory', InventoryPage.render);
      Router.on('customers', CustomersPage.render);
      Router.on('orders',    OrdersPage.render);
      Router.on('shipments', ShipmentsPage.render);
      Router.on('marketing', MarketingPage.render);
      Router.on('team',      TeamPage.render);
      Router.on('settings',  SettingsPage.render);

      // Listen for store changes to re-render topbar
      AppStore.on('storeChanged', () => Topbar.render());

      // Start router
      Router.init();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your StoreVerse password.">
  <title>Forgot Password — StoreVerse</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-brand">
        <div class="brand-mark">S</div>
        <h1>StoreVerse</h1>
      </div>

      <div class="auth-card">
        <h2>Forgot password?</h2>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

        <div id="auth-msg" class="auth-message hidden"></div>

        <form id="forgot-form">
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="input" type="email" id="email" name="email" placeholder="you@example.com" required autofocus>
          </div>
          <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
      </div>

      <div class="auth-footer">
        Remember your password? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.initForgotPassword();
  </script>
</body>
</html>
